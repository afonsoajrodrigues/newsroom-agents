<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ajustes diretos da Câmara X triplicaram desde 2019</title>
<script src="https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js"></script>
<style>
  :root { color-scheme: light dark;
    --surface: #fcfcfb; --text: #0b0b0b; --text-2: #52514e; --grid: #e6e5e1;
    --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --gray: #b5b4ae; --accent: var(--s2); }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
    --surface: #1a1a19; --text: #ffffff; --text-2: #c3c2b7; --grid: #333331;
    --s1: #3987e5; --s2: #d95926; --s3: #199e70; --gray: #5a5955; } }
  :root[data-theme="dark"] { --surface: #1a1a19; --text: #ffffff; --text-2: #c3c2b7; --grid: #333331;
    --s1: #3987e5; --s2: #d95926; --s3: #199e70; --gray: #5a5955; }
  body { margin: 0; background: var(--surface); color: var(--text);
    font: 15px/1.4 -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  .graphic { max-width: 720px; margin: 0 auto; padding: 16px; }
  h1 { font-size: 1.25rem; line-height: 1.25; margin: 0 0 4px; }
  .subtitle { color: var(--text-2); margin: 0 0 12px; }
  figure { margin: 0; }
  svg { width: 100%; height: auto; display: block; overflow: visible; }
  .grid line { stroke: var(--grid); }
  .axis text, .label { fill: var(--text-2); font-size: 12px; }
  .label.value { fill: var(--text); }
  .annotation { fill: var(--text); font-size: 12px; font-weight: 600; }
  .bar { fill: var(--gray); }
  .bar.highlight { fill: var(--accent); }
  .bar:focus, .bar:hover { outline: none; opacity: .85; }
  .tooltip { position: fixed; pointer-events: none; background: var(--text); color: var(--surface);
    padding: 6px 8px; border-radius: 4px; font-size: 12px; opacity: 0; transition: opacity .1s; }
  .source { color: var(--text-2); font-size: 12px; margin-top: 8px; }
  details { margin-top: 8px; font-size: 13px; } table { border-collapse: collapse; width: 100%; }
  td, th { text-align: left; padding: 4px 6px; border-bottom: 1px solid var(--grid); } td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
  .tools { display: flex; gap: 8px; margin-top: 8px; } button { font: inherit; font-size: 12px; padding: 4px 8px; }
  @media (prefers-reduced-motion: no-preference) { .bar { transition: width .4s ease; } }
</style>
</head>
<body>
<div class="graphic">
  <h1>Ajustes diretos da Câmara X triplicaram desde 2019</h1>
  <p class="subtitle">Valor dos contratos adjudicados por ajuste direto pela Câmara Municipal X, em milhões de euros, 2019 a 2025</p>
  <figure role="img" aria-label="Gráfico de barras: o valor anual dos ajustes diretos subiu de 2,1 milhões de euros em 2019 para 6,8 milhões em 2025, o valor mais alto da série.">
    <svg id="chart"></svg>
    <figcaption class="source">Fonte: Portal BASE (IMPIC), extraído em 2026-09-12. Análise: Redação.</figcaption>
  </figure>
  <details><summary>Ver os dados em tabela</summary><table><thead><tr><th>Ano</th><th class="num">Milhões de euros</th></tr></thead><tbody id="table"></tbody></table></details>
  <div class="tools"><button id="dl-svg" type="button">Descarregar SVG</button><button id="dl-png" type="button">Descarregar PNG</button></div>
</div>
<div class="tooltip" id="tip"></div>
<script>
// ---- data (replace with real rows; keep the README next to this file) ----
const DATA = [
  { label: "2019", value: 2.1 }, { label: "2020", value: 2.6 }, { label: "2021", value: 3.4 },
  { label: "2022", value: 4.0 }, { label: "2023", value: 5.2 }, { label: "2024", value: 6.1 }, { label: "2025", value: 6.8 },
];
const HIGHLIGHT = "2025";                       // the mark that proves the title
const ANNOTATION = { label: "2025", text: "Máximo da série: 6,8 M€" };
const UNIT = " M€";

// ---- pt-PT locale ----
const pt = d3.formatLocale({ decimal: ",", thousands: " ", grouping: [3], currency: ["", " €"] });
const fmt = v => pt.format(",.1f")(v) + UNIT;
const ptTime = d3.timeFormatLocale({ dateTime: "%A, %e de %B de %Y às %X", date: "%d/%m/%Y", time: "%H:%M:%S", periods: ["AM", "PM"],
  days: ["domingo","segunda-feira","terça-feira","quarta-feira","quinta-feira","sexta-feira","sábado"], shortDays: ["dom","seg","ter","qua","qui","sex","sáb"],
  months: ["janeiro","fevereiro","março","abril","maio","junho","julho","agosto","setembro","outubro","novembro","dezembro"],
  shortMonths: ["jan.","fev.","mar.","abr.","mai.","jun.","jul.","ago.","set.","out.","nov.","dez."] });

// ---- table view ----
d3.select("#table").selectAll("tr").data(DATA).join("tr").html(d => `<td>${d.label}</td><td class="num">${pt.format(",.1f")(d.value)}</td>`);

// ---- chart (horizontal bars; swap this block for another form) ----
const svg = d3.select("#chart"), tip = d3.select("#tip");
function draw() {
  const width = Math.max(320, svg.node().parentNode.clientWidth || 640);
  const m = { top: 8, right: 64, bottom: 24, left: 44 };
  const height = m.top + m.bottom + DATA.length * 30;
  svg.attr("viewBox", `0 0 ${width} ${height}`).selectAll("*").remove();
  const x = d3.scaleLinear().domain([0, d3.max(DATA, d => d.value)]).nice().range([m.left, width - m.right]);
  const y = d3.scaleBand().domain(DATA.map(d => d.label)).range([m.top, height - m.bottom]).paddingInner(0.3);
  svg.append("g").attr("class", "grid").selectAll("line").data(x.ticks(5)).join("line")
    .attr("x1", d => x(d)).attr("x2", d => x(d)).attr("y1", m.top).attr("y2", height - m.bottom);
  svg.append("g").attr("class", "axis x-axis").attr("transform", `translate(0,${height - m.bottom})`)
    .call(d3.axisBottom(x).ticks(5).tickFormat(pt.format(",.0f")).tickSize(0)).select(".domain").remove();
  svg.append("g").attr("class", "axis y-axis").attr("transform", `translate(${m.left},0)`)
    .call(d3.axisLeft(y).tickSize(0)).select(".domain").remove();
  const bars = svg.append("g").selectAll("rect").data(DATA).join("rect")
    .attr("class", d => "bar" + (d.label === HIGHLIGHT ? " highlight" : ""))
    .attr("x", x(0)).attr("y", d => y(d.label)).attr("height", y.bandwidth()).attr("width", d => x(d.value) - x(0))
    .attr("rx", 2).attr("tabindex", 0).attr("aria-label", d => `${d.label}: ${fmt(d.value)}`);
  svg.append("g").selectAll("text").data(DATA).join("text").attr("class", "label value")
    .attr("x", d => x(d.value) + 6).attr("y", d => y(d.label) + y.bandwidth() / 2).attr("dy", "0.35em").text(d => fmt(d.value));
  const a = DATA.find(d => d.label === ANNOTATION.label);
  if (a) svg.append("text").attr("class", "annotation").attr("x", x(0) + 4).attr("y", y(a.label) - 4).text(ANNOTATION.text);
  const show = (ev, d) => tip.style("opacity", 1).html(`<strong>${d.label}</strong><br>${fmt(d.value)}`)
    .style("left", (ev.clientX ?? 0) + 12 + "px").style("top", (ev.clientY ?? 0) + 12 + "px");
  bars.on("mousemove", show).on("focus", (ev, d) => show({ clientX: 20, clientY: 20 }, d))
      .on("mouseleave blur", () => tip.style("opacity", 0));
  window.parent?.postMessage({ type: "graphic-height", height: document.body.scrollHeight }, "*");
}
draw();
new ResizeObserver(draw).observe(svg.node().parentNode);
document.addEventListener("keydown", e => { if (e.key === "Escape") tip.style("opacity", 0); });

// ---- export ----
function svgString() {
  const node = svg.node().cloneNode(true), css = [...document.styleSheets[0].cssRules].map(r => r.cssText).join("\n");
  node.setAttribute("xmlns", "http://www.w3.org/2000/svg");
  node.insertAdjacentHTML("afterbegin", `<style>${css.replace(/var\(--[^)]+\)/g, m => getComputedStyle(document.documentElement).getPropertyValue(m.slice(4, -1)).trim() || "#000")}</style>`);
  return new XMLSerializer().serializeToString(node);
}
function download(name, blob) { const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = name; a.click(); URL.revokeObjectURL(a.href); }
document.getElementById("dl-svg").onclick = () => download("grafico.svg", new Blob([svgString()], { type: "image/svg+xml" }));
document.getElementById("dl-png").onclick = () => {
  const img = new Image(), vb = svg.attr("viewBox").split(" ").map(Number), c = document.createElement("canvas");
  c.width = vb[2] * 2; c.height = vb[3] * 2;
  img.onload = () => { const ctx = c.getContext("2d"); ctx.fillStyle = getComputedStyle(document.body).backgroundColor; ctx.fillRect(0, 0, c.width, c.height); ctx.drawImage(img, 0, 0, c.width, c.height); c.toBlob(b => download("grafico.png", b)); };
  img.src = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(svgString());
};
</script>
</body>
</html>
