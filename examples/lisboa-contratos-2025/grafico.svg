<svg id="chart" viewBox="0 0 640 312" xmlns="http://www.w3.org/2000/svg" width="640" height="312"><style>:root { color-scheme: light dark; --surface: #fcfcfb; --text: #0b0b0b; --text-2: #52514e; --grid: #e6e5e1; --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --gray: #b5b4ae; --accent: #eb6834; }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --surface: #1a1a19; --text: #ffffff; --text-2: #c3c2b7; --grid: #333331; --s1: #3987e5; --s2: #d95926; --s3: #199e70; --gray: #5a5955; }
}
:root[data-theme="dark"] { --surface: #1a1a19; --text: #ffffff; --text-2: #c3c2b7; --grid: #333331; --s1: #3987e5; --s2: #d95926; --s3: #199e70; --gray: #5a5955; }
body { margin: 0px; background: #fcfcfb; color: #0b0b0b; font: 15px / 1.4 -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
.graphic { max-width: 720px; margin: 0px auto; padding: 16px; }
h1 { font-size: 1.25rem; line-height: 1.25; margin: 0px 0px 4px; }
.subtitle { color: #52514e; margin: 0px 0px 12px; }
figure { margin: 0px; }
svg { width: 100%; height: auto; display: block; overflow: visible; }
.grid line { stroke: #e6e5e1; }
.axis text, .label { fill: #52514e; font-size: 12px; }
.label.value { fill: #0b0b0b; }
.annotation { fill: #0b0b0b; font-size: 12px; font-weight: 600; }
.bar { fill: #b5b4ae; }
.bar.s1 { fill: #2a78d6; }
.bar.s2 { fill: #eb6834; }
.bar:focus, .bar:hover { outline: none; opacity: 0.85; }
.tooltip { position: fixed; pointer-events: none; background: #0b0b0b; color: #fcfcfb; padding: 6px 8px; border-radius: 4px; font-size: 12px; opacity: 0; transition: opacity .1s; }
.source { color: #52514e; font-size: 12px; margin-top: 8px; }
details { margin-top: 8px; font-size: 13px; }
table { border-collapse: collapse; width: 100%; }
td, th { text-align: left; padding: 4px 6px; border-bottom: 1px solid #e6e5e1; }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
.tools { display: flex; gap: 8px; margin-top: 8px; }
button { font: inherit; padding: 4px 8px; }
@media (prefers-reduced-motion: no-preference) {
  .bar { transition: width .4s ease; }
